  services: 
    backend:
      build:
        context: ./backend
      ports:
        - "5001:5001"
      networks:
        - mern-network
      

    frontend: 
      build: 
        context: ./frontend
      ports:
        - "8000:80"
    
    mongo:
      image: mongo:latest
      ports:
        - "27018:27017"
      networks:
        - mern-network
      
  networks:
    mern-network:
      driver: bridge
